name: Daily Registry Update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --no-cache-dir pyyaml

      - name: Refresh registry.yaml
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GITHUB_MODELS_KEY: ${{ secrets.GITHUB_MODELS_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/update_registry.py

      - name: Validate YAML and secret hygiene
        run: |
          python3 -c 'import yaml; d=yaml.safe_load(open("registry.yaml")); assert len(d["pricing"]["models"]) >= 50; assert len(d["providers"]) >= 10; print("Validated:", len(d["pricing"]["models"]), "prices,", len(d["providers"]), "providers")'

      - name: Commit and push changes
        run: |
          git config user.name "2lk-registry-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain registry.yaml)" ]; then
            git add registry.yaml
            git commit -m "chore: daily registry update"
            git push
          else
            echo "No changes to commit."
          fi
